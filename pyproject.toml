[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obligationiq"
version = "0.0.1"
description = "Phase 0: bounded, offline-first compliance evidence gateway"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]
azure = ["openai==2.54.0", "azure-identity==1.25.3"]
corpus = ["pypdf==6.18.1", "numpy==2.5.3", "onnxruntime==1.30.0", "tokenizers==0.23.2"]
register = ["deltalake==1.6.3", "pyarrow==25.0.1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
