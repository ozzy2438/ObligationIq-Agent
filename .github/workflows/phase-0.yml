name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: dry_run
      LLM_ALLOW_LIVE: 'false'
      LOCAL_EMBEDDING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,register]'
      - run: python scripts/check_boundaries.py
      - run: python scripts/build_population.py --check
      - run: python scripts/evaluate_controls.py --check
      - run: pytest
      - run: python -m src
